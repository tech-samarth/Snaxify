<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snaxify • Not Accepting Orders</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .glow {
            text-shadow: 0 0 10px #22c55e, 0 0 25px #16a34a;
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px);}
            to { opacity: 1; transform: translateY(0);}
        }
    </style>
</head>

<body class="bg-gradient-to-br from-black via-gray-900 to-black text-white flex items-center justify-center min-h-screen px-6">

    <div class="text-center fade-in">

        <!-- Logo -->
        <div class="flex justify-center mb-6">
            <img src="logo.png" 
                 onerror="this.src='https://picsum.photos/100'" 
                 class="w-24 h-24 rounded-full shadow-xl">
        </div>

        <!-- Brand -->
        <h1 class="text-5xl md:text-6xl font-black text-green-400 glow">
            Snaxify
        </h1>

        <p class="text-green-300 font-semibold mt-1">
            Fueling Your Nights
        </p>

        <!-- Icon -->
        <div class="mt-10">
            <i class="fa-solid fa-ban text-7xl text-red-500"></i>
        </div>

        <!-- Message -->
        <h2 class="text-3xl md:text-4xl font-extrabold mt-6">
            See you Tommorrow
        </h2>

        <p class="text-gray-400 mt-4 text-lg">
            Please try again later.
        </p>

        <!-- Button -->
        <button onclick="location.reload()" 
                class="mt-8 px-8 py-4 bg-green-500 hover:bg-green-600 text-black font-bold rounded-2xl shadow-xl transition">
            Refresh 🔄
        </button>

        <!-- Footer -->
        <p class="text-gray-600 text-sm mt-10">
            © 2026 Snaxify
        </p>

    </div>

</body>
</html>
